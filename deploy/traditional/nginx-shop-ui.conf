# 非容器化部署：nginx 完整配置（托管前端静态 + 反代本机后端）
# 用法：把 root 改成实际 dist 目录；作为 /etc/nginx/nginx.conf 使用并 reload
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;        # 隐藏版本号

    # 登录接口限速：单 IP 每分钟 10 次，突发 5；超限返回 429
    limit_req_zone $binary_remote_addr zone=login_ip:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;

    server {
        listen 8000;
        server_name _;

        root /opt/shop/shop-ui/dist;
        index index.html;

        # 登录接口单独限速，防口令爆破（不影响其它 /api/ 流量）
        location = /api/admin/employee/login {
            limit_req zone=login_ip burst=5 nodelay;
            limit_conn perip 20;
            proxy_pass http://127.0.0.1:8080/admin/employee/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/user/user/login {
            limit_req zone=login_ip burst=5 nodelay;
            limit_conn perip 20;
            proxy_pass http://127.0.0.1:8080/user/user/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前端 SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端接口：去掉 /api 前缀转发到本机后端
        location /api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket：来单提醒 / 客户催单
        location /ws {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # 处理用户端发送的请求
        location /user/ {
            proxy_pass http://127.0.0.1:8080/user/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
